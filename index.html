<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎓 Student Management System</h1>
        <p>Manage student records easily</p>
    </header>

    <main class="container">

        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="stat-card">
                <h3>Average Marks</h3>
                <p id="averageMarks">0</p>
            </div>

            <div class="stat-card">
                <h3>Passed</h3>
                <p id="passedStudents">0</p>
            </div>
        </section>

        <!-- Add Student Form -->
        <section class="form-section">
            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="input-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="Enter student name" required>
                </div>

                <div class="input-group">
                    <label for="roll">Roll Number</label>
                    <input type="text" id="roll" placeholder="Enter roll number" required>
                </div>

                <div class="input-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" placeholder="Enter course" required>
                </div>

                <div class="input-group">
                    <label for="marks">Marks</label>
                    <input type="number" id="marks" placeholder="Enter marks (0-100)" min="0" max="100" required>
                </div>

                <button type="submit">Add Student</button>
            </form>
        </section>

        <!-- Search -->
        <section class="search-section">
            <input
                type="text"
                id="search"
                placeholder="🔍 Search by name, roll number or course..."
            >
        </section>

        <!-- Student Table -->
        <section class="table-section">

            <h2>Student Records</h2>

            <div class="table-container">
                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Course</th>
                            <th>Marks</th>
                            <th>Grade</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                    </tbody>

                </table>
            </div>

            <p id="emptyMessage" class="empty-message">
                No student records available.
            </p>

        </section>

    </main>

    <footer>
        <p>© 2026 Student Management System | Web Development Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
